<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"__bg","type":"string","label":"Background color","default":"#0b0d10"},
    {"id":"__text","type":"string","label":"Text color","default":"#f4f4f5"},
    {"id":"__primary","type":"string","label":"Primary color","default":"#7c5cff"},
    {"id":"kicker","type":"string","label":"Kicker (above number)","default":"WE JUST HIT"},
    {"id":"heroNumber","type":"string","label":"Hero number","default":"$10K"},
    {"id":"heroLabel","type":"string","label":"Hero label","default":"MONTHLY RECURRING"},
    {"id":"caption","type":"string","label":"Caption","default":"Thank you to every customer along the way.","required":false},
    {"id":"brandName","type":"string","label":"Brand name","default":"Acme"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>Milestone — Landscape</title>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1200" data-height="676" data-start="0" data-duration="8" data-track-index="0">
      <div class="bg-base"></div>
      <div class="slab" id="slab" data-layout-ignore data-decorative></div>
      <div class="grain" data-layout-ignore data-decorative></div>
      <div class="loop-flash" id="loopFlash" data-layout-ignore data-decorative></div>

      <div class="scene">
        <div class="left">
          <div class="kicker-row">
            <span class="kicker-bar"></span>
            <span class="kicker" id="kicker"></span>
          </div>

          <div class="hero-mask">
            <div class="hero-number" id="heroNumber"></div>
          </div>

          <div class="caption" id="caption"></div>
        </div>

        <div class="right">
          <div class="hero-label" id="heroLabel"></div>
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name" id="brandName"></span>
          </div>
        </div>
      </div>

      <style>
        #root {
          position: relative;
          width: 1200px;
          height: 676px;
          overflow: hidden;
          font-family: "Inter", system-ui, sans-serif;
          color: var(--text, #f4f4f5);
          background: var(--bg, #0b0d10);
        }
        #root * { box-sizing: border-box; }

        .bg-base { position: absolute; inset: 0; background: var(--bg, #0b0d10); z-index: 0; }

        /* Right-side slab anchoring the label column */
        .slab {
          position: absolute;
          top: -120px;
          right: -160px;
          width: 720px;
          height: 920px;
          background: var(--primary, #7c5cff);
          transform: rotate(15deg);
          z-index: 1;
          will-change: transform, opacity;
        }

        .grain {
          position: absolute; inset: 0; z-index: 2;
          opacity: 0.10; mix-blend-mode: overlay;
          background-image:
            radial-gradient(circle at 20% 30%, rgba(255,255,255,0.6) 0, transparent 1px),
            radial-gradient(circle at 70% 60%, rgba(255,255,255,0.6) 0, transparent 1px),
            radial-gradient(circle at 40% 80%, rgba(255,255,255,0.6) 0, transparent 1px),
            radial-gradient(circle at 85% 15%, rgba(255,255,255,0.6) 0, transparent 1px);
          background-size: 6px 6px, 5px 5px, 7px 7px, 4px 4px;
        }

        .loop-flash {
          position: absolute; inset: 0;
          background: var(--primary, #7c5cff);
          z-index: 80; opacity: 0; pointer-events: none;
        }

        .scene {
          position: relative;
          width: 100%; height: 100%;
          padding: 64px 72px;
          display: flex;
          flex-direction: row;
          gap: 48px;
          z-index: 10;
        }

        .left {
          flex: 1 1 60%;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          min-width: 0;
        }
        .right {
          flex: 0 0 36%;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          align-items: flex-start;
        }

        .kicker-row {
          display: flex;
          align-items: center;
          gap: 16px;
        }
        .kicker-bar {
          display: inline-block;
          width: 44px; height: 4px;
          background: var(--primary, #7c5cff);
          will-change: transform;
        }
        .kicker {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 18px;
          letter-spacing: 5px;
          text-transform: uppercase;
        }

        .hero-mask {
          overflow: hidden;
          padding: 0 8px 12px 0;
        }
        .hero-number {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 900;
          font-size: 240px;
          line-height: 0.92;
          letter-spacing: -0.04em;
          color: var(--text, #f4f4f5);
          font-variant-numeric: tabular-nums;
          will-change: transform, opacity;
          white-space: nowrap;
        }

        .caption {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 500;
          font-size: 22px;
          line-height: 1.3;
          color: var(--text, #f4f4f5);
          opacity: 0.9;
          max-width: 540px;
          will-change: transform, opacity;
        }

        .hero-label {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 800;
          font-size: 28px;
          letter-spacing: 3px;
          text-transform: uppercase;
          color: var(--text, #f4f4f5);
          line-height: 1.15;
          align-self: stretch;
          will-change: transform, opacity;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 20px;
          letter-spacing: 1px;
          color: var(--text, #f4f4f5);
          will-change: transform, opacity;
        }
        .brand-dot {
          display: inline-block;
          width: 12px; height: 12px;
          background: var(--primary, #7c5cff);
          border-radius: 50%;
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const vars = window.__hyperframes.getVariables();
          const root = document.getElementById("root");
          if (vars.__bg) root.style.setProperty("--bg", vars.__bg);
          if (vars.__text) root.style.setProperty("--text", vars.__text);
          if (vars.__primary) root.style.setProperty("--primary", vars.__primary);

          document.getElementById("kicker").textContent = vars.kicker || "";
          document.getElementById("heroNumber").textContent = vars.heroNumber || "";
          document.getElementById("heroLabel").textContent = vars.heroLabel || "";
          document.getElementById("caption").textContent = vars.caption || "";
          document.getElementById("brandName").textContent = vars.brandName || "";

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#slab",
            { x: 900, rotate: 28, opacity: 0 },
            { x: 0, rotate: 15, opacity: 1, duration: 0.85, ease: "expo.out" },
            0
          );

          tl.fromTo(".kicker-bar",
            { scaleX: 0, transformOrigin: "left center" },
            { scaleX: 1, duration: 0.5, ease: "power3.out" },
            0.35
          );
          tl.from(".kicker",
            { x: -24, opacity: 0, duration: 0.55, ease: "power3.out" },
            0.45
          );

          tl.fromTo("#heroNumber",
            { y: 160, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.95, ease: "expo.out" },
            0.6
          );
          tl.fromTo("#heroNumber",
            { scale: 0.94 },
            { scale: 1, duration: 0.5, ease: "back.out(2)" },
            1.0
          );

          tl.fromTo("#heroLabel",
            { x: 60, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.6, ease: "expo.out" },
            1.2
          );

          tl.from("#caption",
            { y: 18, opacity: 0, duration: 0.55, ease: "power3.out" },
            1.55
          );

          tl.from(".brand",
            { y: 14, opacity: 0, duration: 0.5, ease: "power3.out" },
            1.8
          );

          // Ambient
          tl.to("#slab",
            { x: -22, duration: 4.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
            2.6
          );
          tl.to("#heroNumber",
            { scale: 1.02, duration: 1.0, yoyo: true, repeat: 3, ease: "sine.inOut" },
            3.0
          );
          tl.set("#heroNumber", { scale: 1 }, 7.0);

          // Loop primer
          tl.to("#heroNumber",
            { scale: 1.05, duration: 0.5, ease: "power2.in", overwrite: "auto" },
            7.0
          );
          tl.to("#loopFlash",
            { opacity: 1, duration: 0.55, ease: "power3.in" },
            7.4
          );

          window.__timelines["root"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
