<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"__bg","type":"string","label":"Background color","default":"#0b0d10"},
    {"id":"__text","type":"string","label":"Text color","default":"#f4f4f5"},
    {"id":"__primary","type":"string","label":"Primary color","default":"#7c5cff"},
    {"id":"title","type":"string","label":"Title","default":"WHAT SHIPPED"},
    {"id":"subtitle","type":"string","label":"Subtitle","default":"This week","required":false},
    {"id":"features","type":"string_array","label":"Features (1–5)","min":1,"max":5,"default":["New billing dashboard","Faster image uploads","Stripe webhook race fix","12 paying users onboarded","Latency cut in half"]},
    {"id":"brandName","type":"string","label":"Brand name","default":"Acme"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>Changelog — Square</title>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1080" data-height="1080" data-start="0" data-duration="10" data-track-index="0">
      <div class="bg-base"></div>
      <div class="grain" data-layout-ignore data-decorative></div>
      <div class="loop-flash" id="loopFlash" data-layout-ignore data-decorative></div>

      <div class="scene">
        <div class="header">
          <div class="title-row">
            <div class="title" id="title"></div>
            <div class="title-bar" id="titleBar"></div>
          </div>
          <div class="subtitle" id="subtitle"></div>
        </div>

        <div class="timeline">
          <div class="rail" id="rail"></div>
          <div class="cards" id="cards"></div>
        </div>

        <div class="footer">
          <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name" id="brandName"></span>
          </div>
        </div>
      </div>

      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          font-family: "Inter", system-ui, sans-serif;
          color: var(--text, #f4f4f5);
          background: var(--bg, #0b0d10);
        }
        #root * { box-sizing: border-box; }

        .bg-base { position: absolute; inset: 0; background: var(--bg, #0b0d10); z-index: 0; }
        .grain {
          position: absolute; inset: 0; z-index: 2;
          opacity: 0.10; mix-blend-mode: overlay;
          background-image:
            radial-gradient(circle at 20% 30%, rgba(255,255,255,0.6) 0, transparent 1px),
            radial-gradient(circle at 70% 60%, rgba(255,255,255,0.6) 0, transparent 1px),
            radial-gradient(circle at 40% 80%, rgba(255,255,255,0.6) 0, transparent 1px);
          background-size: 6px 6px, 5px 5px, 7px 7px;
        }

        .loop-flash {
          position: absolute; inset: 0;
          background: var(--primary, #7c5cff);
          z-index: 80; opacity: 0; pointer-events: none;
        }

        .scene {
          position: relative;
          width: 100%; height: 100%;
          padding: 80px 80px 64px;
          display: flex;
          flex-direction: column;
          z-index: 10;
        }

        /* Header */
        .header {
          display: flex;
          flex-direction: column;
          gap: 16px;
          margin-bottom: 36px;
          will-change: transform, opacity;
        }
        .title-row {
          display: flex;
          align-items: center;
          gap: 22px;
        }
        .title {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 900;
          font-size: 76px;
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--text, #f4f4f5);
          will-change: transform, opacity;
        }
        .title-bar {
          flex: 1;
          height: 6px;
          background: var(--primary, #7c5cff);
          transform-origin: left center;
          will-change: transform;
        }
        .subtitle {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 600;
          font-size: 22px;
          letter-spacing: 4px;
          text-transform: uppercase;
          color: var(--text, #f4f4f5);
          opacity: 0.65;
        }

        /* Timeline */
        .timeline {
          position: relative;
          flex: 1;
          padding-left: 0;
        }
        .rail {
          position: absolute;
          left: 38px;
          top: 0;
          bottom: 0;
          width: 4px;
          background: var(--primary, #7c5cff);
          opacity: 0.35;
          transform-origin: top center;
          will-change: transform;
        }
        .cards {
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .card {
          position: relative;
          display: flex;
          align-items: center;
          gap: 22px;
          will-change: transform, opacity;
        }
        .index {
          flex: 0 0 80px;
          height: 80px;
          background: var(--primary, #7c5cff);
          color: var(--bg, #0b0d10);
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 900;
          font-size: 32px;
          letter-spacing: 1px;
          display: flex;
          align-items: center;
          justify-content: center;
          line-height: 1;
          font-variant-numeric: tabular-nums;
        }
        .text-wrap {
          flex: 1;
          padding: 18px 22px;
          background: rgba(255, 255, 255, 0.04);
          border-left: 4px solid var(--text, #f4f4f5);
          min-height: 80px;
          display: flex;
          align-items: center;
        }
        .text {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 600;
          font-size: 30px;
          line-height: 1.2;
          color: var(--text, #f4f4f5);
        }

        /* Footer */
        .footer {
          display: flex;
          justify-content: flex-end;
          padding-top: 24px;
        }
        .brand {
          display: flex;
          align-items: center;
          gap: 12px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 24px;
          letter-spacing: 1px;
          color: var(--text, #f4f4f5);
          will-change: transform, opacity;
        }
        .brand-dot {
          display: inline-block;
          width: 14px; height: 14px;
          background: var(--primary, #7c5cff);
          border-radius: 50%;
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const vars = window.__hyperframes.getVariables();
          const root = document.getElementById("root");
          if (vars.__bg) root.style.setProperty("--bg", vars.__bg);
          if (vars.__text) root.style.setProperty("--text", vars.__text);
          if (vars.__primary) root.style.setProperty("--primary", vars.__primary);

          document.getElementById("title").textContent = vars.title || "";
          document.getElementById("subtitle").textContent = vars.subtitle || "";
          document.getElementById("brandName").textContent = vars.brandName || "";

          const features = Array.isArray(vars.features) ? vars.features.slice(0, 5) : [];
          const cardsEl = document.getElementById("cards");
          features.forEach((feature, i) => {
            const card = document.createElement("div");
            card.className = "card";
            card.id = "card" + (i + 1);
            const idx = String(i + 1).padStart(2, "0");
            card.innerHTML = '<div class="index">' + idx + '</div>' +
              '<div class="text-wrap"><div class="text"></div></div>';
            card.querySelector(".text").textContent = feature;
            cardsEl.appendChild(card);
          });

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // 0.0–0.6s: title block reveals
          tl.from(".title",
            { y: 40, opacity: 0, duration: 0.6, ease: "expo.out" },
            0
          );
          tl.fromTo("#titleBar",
            { scaleX: 0, transformOrigin: "left center" },
            { scaleX: 1, duration: 0.6, ease: "power3.out" },
            0.2
          );
          tl.from(".subtitle",
            { y: 16, opacity: 0, duration: 0.5, ease: "power3.out" },
            0.45
          );

          // 0.7s: rail draws down
          tl.fromTo("#rail",
            { scaleY: 0 },
            { scaleY: 1, duration: 0.6, ease: "power3.inOut" },
            0.7
          );

          // 1.0s+: cards stamp in from alternating sides
          features.forEach((_, i) => {
            const startAt = 1.0 + i * 0.5;
            const id = "#card" + (i + 1);
            const fromX = i % 2 === 0 ? -80 : 80;
            tl.fromTo(id,
              { x: fromX, opacity: 0, rotation: i % 2 === 0 ? -2 : 2 },
              { x: 0, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" },
              startAt
            );
            tl.fromTo(id + " .index",
              { scale: 0.4, rotation: -10 },
              { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.5)" },
              startAt + 0.1
            );
          });

          // Brand fades after last card
          const lastCard = 1.0 + (features.length - 1) * 0.5;
          tl.from(".brand",
            { y: 18, opacity: 0, duration: 0.5, ease: "power3.out" },
            lastCard + 0.6
          );

          // Ambient hold: subtle brand-dot pulse
          tl.to(".brand-dot",
            { scale: 1.4, duration: 0.7, yoyo: true, repeat: 4, ease: "sine.inOut" },
            lastCard + 1.2
          );

          // Loop primer at duration - 0.6s = 9.4s
          tl.to(".cards",
            { y: -20, opacity: 0.6, duration: 0.45, ease: "power2.in" },
            9.2
          );
          tl.to("#loopFlash",
            { opacity: 1, duration: 0.5, ease: "power3.in" },
            9.5
          );

          window.__timelines["root"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
