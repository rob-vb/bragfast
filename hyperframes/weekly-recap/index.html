<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"heroNumber","type":"string","label":"Hero number","default":"$5,247"},
    {"id":"heroLabel","type":"string","label":"Hero label","default":"MRR"},
    {"id":"weekLabel","type":"string","label":"Week label","default":"WEEK 12"},
    {"id":"ship1","type":"string","label":"Ship 1","default":"Shipped public template library"},
    {"id":"ship2","type":"string","label":"Ship 2","default":"Added video gen via Lambda"},
    {"id":"ship3","type":"string","label":"Ship 3","default":"Fixed Stripe webhook race"},
    {"id":"ship4","type":"string","label":"Ship 4","default":"Onboarded 12 paying users"},
    {"id":"ship5","type":"string","label":"Ship 5","default":"Cut latency in half"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>brag.fast — Weekly Hype Recap</title>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1080" data-height="1080" data-start="0" data-duration="8" data-track-index="0">
      <!-- Background layer: surface, grid, ghost type, confetti, gold flash -->
      <div class="bg-base"></div>
      <div class="bg-grid"></div>
      <div class="ghost ghost-top" aria-hidden="true" data-layout-ignore data-decorative>HYPE</div>
      <div class="ghost ghost-bot" aria-hidden="true" data-layout-ignore data-decorative>WEEK</div>
      <div class="confetti-layer" id="confetti"></div>
      <div class="loop-flash" id="loopFlash"></div>

      <!-- Content -->
      <div class="scene-content">
        <div class="top-row" data-layout-allow-overflow>
          <div class="week-tag" id="weekTag" data-layout-allow-overflow></div>
          <div class="dot-row">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          </div>
        </div>

        <div class="hero">
          <div class="hero-number" id="heroNumber"></div>
          <div class="hero-label" id="heroLabel"></div>
        </div>

        <div class="divider" id="divider"></div>

        <ul class="ships" data-layout-allow-overflow>
          <li class="ship" id="ship1"><span class="caret">▸</span><span class="text"></span></li>
          <li class="ship" id="ship2"><span class="caret">▸</span><span class="text"></span></li>
          <li class="ship" id="ship3"><span class="caret">▸</span><span class="text"></span></li>
          <li class="ship" id="ship4"><span class="caret">▸</span><span class="text"></span></li>
          <li class="ship" id="ship5"><span class="caret">▸</span><span class="text"></span></li>
        </ul>

        <div class="brand-mark" id="brandMark">
          <span class="bm-tag">▸</span><span class="bm-name">brag.fast</span>
        </div>
      </div>

      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1080px;
          overflow: hidden;
          font-family: "Geist", "Geist Sans", system-ui, sans-serif;
          color: #4a3326;
          background: #fff8f0;
        }
        #root * {
          box-sizing: border-box;
        }

        /* Background layers */
        .bg-base {
          position: absolute;
          inset: 0;
          background: #fff8f0;
          z-index: 0;
        }
        .bg-grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(to right, rgba(74, 51, 38, 0.06) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(74, 51, 38, 0.06) 1px, transparent 1px);
          background-size: 60px 60px;
          z-index: 1;
          opacity: 0.9;
        }
        .ghost {
          position: absolute;
          font-family: "Press Start 2P", monospace;
          color: rgba(74, 51, 38, 0.05);
          font-size: 220px;
          letter-spacing: 8px;
          z-index: 2;
          pointer-events: none;
          white-space: nowrap;
        }
        .ghost-top {
          top: 40px;
          left: -30px;
        }
        .ghost-bot {
          bottom: 60px;
          right: -40px;
        }

        .confetti-layer {
          position: absolute;
          inset: 0;
          z-index: 3;
          pointer-events: none;
        }
        .confetti {
          position: absolute;
          left: 50%;
          top: 38%;
          width: 22px;
          height: 22px;
          margin-left: -11px;
          margin-top: -11px;
          opacity: 0;
        }

        .loop-flash {
          position: absolute;
          inset: 0;
          background: #f8af3c;
          z-index: 80;
          opacity: 0;
          pointer-events: none;
        }

        /* Content container fills scene with padding */
        .scene-content {
          position: relative;
          width: 100%;
          height: 100%;
          padding: 64px 80px;
          display: flex;
          flex-direction: column;
          z-index: 10;
        }

        /* Top row: week tag + decorative dots */
        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 28px;
        }
        .week-tag {
          font-family: "Press Start 2P", monospace;
          font-size: 24px;
          color: #fff8f0;
          background: #4a3326;
          padding: 12px 18px;
          border: 3px solid #4a3326;
          box-shadow: 6px 6px 0 #4a3326;
          letter-spacing: 2px;
        }
        .dot-row {
          display: flex;
          gap: 16px;
        }
        .dot {
          width: 24px;
          height: 24px;
          background: #4a3326;
          border: 3px solid #4a3326;
        }
        .dot:nth-child(2) {
          background: #f8af3c;
        }
        .dot:nth-child(3) {
          background: #fff8f0;
        }

        /* Hero */
        .hero {
          display: flex;
          flex-direction: column;
          align-items: center;
          margin-bottom: 16px;
        }
        .hero-number {
          font-family: "Press Start 2P", monospace;
          font-size: 132px;
          color: #4a3326;
          text-shadow: 8px 8px 0 #f8af3c;
          letter-spacing: 0;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          will-change: transform, opacity;
        }
        .hero-label {
          font-family: "Press Start 2P", monospace;
          font-size: 32px;
          color: #4a3326;
          background: #f8af3c;
          padding: 10px 18px;
          margin-top: 22px;
          border: 3px solid #4a3326;
          box-shadow: 5px 5px 0 #4a3326;
          letter-spacing: 3px;
        }

        /* Divider */
        .divider {
          width: 100%;
          height: 5px;
          background: #4a3326;
          margin: 22px 0 18px;
          transform-origin: left center;
        }

        /* Ships list */
        .ships {
          list-style: none;
          padding: 0;
          margin: 0;
          display: flex;
          flex-direction: column;
          gap: 12px;
          flex: 1;
        }
        .ship {
          font-family: "Geist", "Geist Sans", system-ui, sans-serif;
          font-weight: 700;
          font-size: 28px;
          color: #4a3326;
          background: #ffffff;
          padding: 12px 18px;
          border: 3px solid #4a3326;
          box-shadow: 5px 5px 0 #4a3326;
          display: flex;
          align-items: center;
          gap: 14px;
          will-change: transform, opacity;
          line-height: 1.1;
        }
        .ship .caret {
          font-family: "Press Start 2P", monospace;
          color: #4a3326;
          background: #f8af3c;
          font-size: 18px;
          flex-shrink: 0;
          padding: 6px 8px;
          border: 2px solid #4a3326;
          line-height: 1;
        }
        .ship .text {
          line-height: 1.15;
        }
        .ship:nth-child(odd) {
          background: #fff8f0;
        }

        /* Brand mark */
        .brand-mark {
          align-self: flex-end;
          margin-top: 14px;
          font-family: "Press Start 2P", monospace;
          font-size: 20px;
          color: #4a3326;
          display: flex;
          align-items: center;
          gap: 10px;
          letter-spacing: 1px;
          line-height: 1;
        }
        .brand-mark .bm-tag {
          color: #4a3326;
          background: #f8af3c;
          padding: 4px 6px;
          border: 2px solid #4a3326;
          line-height: 1;
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          const vars = window.__hyperframes.getVariables();

          // Inject variable text
          document.getElementById("weekTag").textContent = vars.weekLabel;
          document.getElementById("heroNumber").textContent = vars.heroNumber;
          document.getElementById("heroLabel").textContent = vars.heroLabel;
          ["ship1", "ship2", "ship3", "ship4", "ship5"].forEach((id) => {
            document.querySelector("#" + id + " .text").textContent = vars[id];
          });

          // Seeded PRNG (mulberry32)
          function mulberry32(a) {
            return function () {
              let t = (a += 0x6d2b79f5);
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const rand = mulberry32(9999);

          // Build confetti pieces
          const confettiHost = document.getElementById("confetti");
          const palette = ["#f8af3c", "#4a3326", "#ffffff", "#f8af3c", "#f8af3c"];
          const PIECES = 36;
          const pieces = [];
          for (let i = 0; i < PIECES; i++) {
            const el = document.createElement("div");
            el.className = "confetti";
            const color = palette[Math.floor(rand() * palette.length)];
            el.style.background = color;
            el.style.border = "2px solid #4a3326";
            const w = 14 + Math.floor(rand() * 18);
            const h = 14 + Math.floor(rand() * 18);
            el.style.width = w + "px";
            el.style.height = h + "px";
            el.style.marginLeft = -w / 2 + "px";
            el.style.marginTop = -h / 2 + "px";
            confettiHost.appendChild(el);
            const angle = rand() * Math.PI * 2;
            const dist = 280 + rand() * 360;
            pieces.push({
              el,
              tx: Math.cos(angle) * dist,
              ty: Math.sin(angle) * dist - 80, // bias slightly up
              rot: (rand() - 0.5) * 720,
              delay: rand() * 0.18,
            });
          }

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          // -------------------- 0.0–0.6s: opening flash + hero slam --------------------
          // Background gold→surface flash already implied by .loop-flash
          tl.fromTo(
            "#loopFlash",
            { opacity: 1 },
            { opacity: 0, duration: 0.45, ease: "power3.out" },
            0
          );

          // Confetti burst
          pieces.forEach((p) => {
            tl.fromTo(
              p.el,
              { x: 0, y: 0, rotation: 0, opacity: 1, scale: 0.6 },
              {
                x: p.tx,
                y: p.ty,
                rotation: p.rot,
                scale: 1,
                duration: 1.4,
                ease: "power2.out",
              },
              0.15 + p.delay
            );
            tl.to(
              p.el,
              {
                y: p.ty + 360,
                opacity: 0,
                duration: 1.6,
                ease: "power1.in",
              },
              0.9 + p.delay
            );
          });

          // Hero number SLAM
          tl.fromTo(
            "#heroNumber",
            { scale: 0.2, opacity: 0, rotation: -8 },
            { scale: 1, opacity: 1, rotation: 0, duration: 0.55, ease: "back.out(2.4)" },
            0.18
          );
          // Quick punch-shake right after slam
          tl.to(
            "#heroNumber",
            { x: -6, duration: 0.05, yoyo: true, repeat: 5, ease: "power1.inOut" },
            0.72
          );
          tl.set("#heroNumber", { x: 0 }, 1.05);

          // Hero label fade up
          tl.from(
            "#heroLabel",
            { y: 32, opacity: 0, duration: 0.45, ease: "power3.out" },
            0.55
          );

          // -------------------- 0.7–1.6s: top row + divider --------------------
          tl.from(
            "#weekTag",
            { x: -160, opacity: 0, duration: 0.55, ease: "expo.out" },
            0.7
          );
          tl.from(
            ".dot",
            { scale: 0, opacity: 0, duration: 0.35, ease: "back.out(2)", stagger: 0.08 },
            0.85
          );

          // Divider draws across
          tl.from(
            "#divider",
            { scaleX: 0, duration: 0.5, ease: "power3.inOut" },
            1.25
          );

          // -------------------- 1.7–4.0s: ships snap in --------------------
          const shipIds = ["#ship1", "#ship2", "#ship3", "#ship4", "#ship5"];
          const shipEases = [
            "back.out(2)",
            "expo.out",
            "back.out(1.8)",
            "power4.out",
            "back.out(2.2)",
          ];
          shipIds.forEach((id, i) => {
            const startAt = 1.7 + i * 0.42;
            const fromX = i % 2 === 0 ? -120 : 120;
            tl.fromTo(
              id,
              { x: fromX, opacity: 0, rotation: i % 2 === 0 ? -2 : 2 },
              {
                x: 0,
                opacity: 1,
                rotation: 0,
                duration: 0.55,
                ease: shipEases[i],
              },
              startAt
            );
            // tiny shadow-pop bounce
            tl.fromTo(
              id,
              { boxShadow: "0px 0px 0 #4a3326" },
              { boxShadow: "6px 6px 0 #4a3326", duration: 0.25, ease: "power2.out" },
              startAt + 0.18
            );
          });

          // -------------------- 4.0–4.6s: brand mark --------------------
          tl.from(
            "#brandMark",
            { y: 28, opacity: 0, duration: 0.5, ease: "power3.out" },
            4.1
          );

          // -------------------- 4.6–7.2s: ambient hold --------------------
          // Subtle hero pulse so the screen never feels frozen — finishes before loop primer at 7.2s
          tl.to(
            "#heroNumber",
            {
              scale: 1.04,
              duration: 0.65,
              yoyo: true,
              repeat: 3,
              ease: "sine.inOut",
            },
            4.6
          );
          tl.set("#heroNumber", { scale: 1 }, 7.2);
          // Ghost type drift
          tl.fromTo(
            ".ghost-top",
            { x: 0 },
            { x: 30, duration: 8, ease: "sine.inOut" },
            0
          );
          tl.fromTo(
            ".ghost-bot",
            { x: 0 },
            { x: -30, duration: 8, ease: "sine.inOut" },
            0
          );
          // Dots pulse
          tl.to(
            ".dot:nth-child(2)",
            {
              scale: 1.25,
              duration: 0.6,
              yoyo: true,
              repeat: 6,
              ease: "sine.inOut",
            },
            1.8
          );

          // -------------------- 7.2–8.0s: loop primer --------------------
          // Hero zooms slightly + screen flashes gold to seamlessly meet 0s
          tl.to(
            "#heroNumber",
            { scale: 1.12, duration: 0.5, ease: "power2.in", overwrite: "auto" },
            7.2
          );
          tl.to(
            "#loopFlash",
            { opacity: 1, duration: 0.45, ease: "power3.in" },
            7.55
          );

          window.__timelines["root"] = tl;
        })();
      </script>
    </div>

  </body>
</html>
